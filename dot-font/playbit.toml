app_id = "dot-font"
name = "Dot font"
lang = "rust"
required_host_features = [
    "bloblog.append.begin",
    "bloblog.append.take",
    "bloblog.read.begin",
    "bloblog.read.take",
    "clock.read",
    "file.close.begin",
    "file.close.take",
    "file.open.begin",
    "file.open.take",
    "file.write.begin",
    "file.write.take",
    "random.fill",
    "ui.canvas.pixels.v1",
    "ui.canvas.viewport.v1",
    "ui.window.size-constraints.v1",
    "ui.window.style.v1",
    "wake.after",
]
icon = "icon.png"
build_cmd = "cargo rustc --lib --crate-type cdylib"

[release]
build_cmd = "cargo rustc --release --lib --crate-type cdylib"

[native]
build_cmd = "cargo rustc --bin playbit-app --features native --target aarch64-apple-darwin -- @target/playbit/native.rsp"

[native.release]
build_cmd = "cargo rustc --release --bin playbit-app --features native --target aarch64-apple-darwin -- @target/playbit/native.rsp"
